[project]
name = "ttsclient"
version = "2.0.0"
description = "GPT-SoVITS TTS client server"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "numpy>=2.0",
    "requests>=2.31",
    "torch>=2.10.0",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

